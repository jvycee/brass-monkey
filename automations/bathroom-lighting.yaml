# ============================================================================
# TIPS & TUNING
# ============================================================================

# Motion sensor placement:
# - Mount in corner opposite door (sees whole room)
# - Height: 6-7 feet for best coverage
# - Angle slightly downward
# - Avoid direct line of sight to toilet (privacy)
#
# Timing adjustments:
# - Night delay (30s): Increase if light turns off while brushing teeth
# - Day delay (60s): Increase for longer showers
# - Timeout (10-15 min): Safety in case sensor fails
#
# Brightness levels:
# - Night (20%): Adjust if too bright/dim for your eyes
# - Kelvin (2200): Lower = more amber/orange = less wake-up
#
# False positives:
# - If triggering from hallway: narrow sensor angle or relocate
# - If not triggering: check battery, mount height, angle
#
# Manual override:
# - 30 min timeout allows manual control without automation fighting you
# - Useful when cleaning, bathing kids, etc.
