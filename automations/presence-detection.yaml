# ============================================================================
# HELPER: Away Mode Toggle
# ============================================================================

# Create this in Home Assistant UI:
# Settings → Devices & Services → Helpers → Create Helper → Toggle
# Name: "Away Mode"
# Entity ID: input_boolean.away_mode
#
# This tracks whether you're home or away, preventing duplicate triggers
# from multiple detection methods

# ============================================================================
# NOTES
# ============================================================================

# Why this works:
# - Geofence triggers first (2 min delay prevents false positives)
# - Door sensor only triggers if geofence failed
# - input_boolean.away_mode prevents duplicate triggers
# - NFC tags can manually call scripts regardless of state
#
# Tuning tips:
# - Adjust geofence delay (2 min) if too slow/fast
# - Adjust door closed delay (30s) based on your routine
# - Monitor notifications to see which method triggers most
#
# False positive prevention:
# - Taking out trash: Door opens/closes but you're back in 30s = no trigger
# - Checking mail: Geofence 2-min delay catches quick returns
# - Guest leaving: Door sensor works even if your phone stays home
